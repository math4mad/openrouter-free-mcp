# Smithery configuration file: https://smithery.ai/docs/config

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      openrouterKey:
        type: string
        title: OpenRouter API Key
        description: OpenRouter API key (sk-or-v1-...)，在 https://openrouter.ai/keys 免费获取
    required:
      - openrouterKey
  commandFunction: |-
    (config) => ({
      command: 'node',
      args: ['${__dirname}/server.js'],
      env: { OPENROUTER_KEY: config.openrouterKey }
    })
